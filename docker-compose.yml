version: "3.8"

services:
  orbitaos-v6:
    image: orbitaos-v6:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      - AppUrls__Documentation=${AppUrls__Documentation}
    volumes:
      - orbitaos-v6-logs:/app/logs
      - ./OrbitAOS.V6/appsettings.json:/app/appsettings.json:ro
      - ./OrbitAOS.V6/appsettings.Production.json:/app/appsettings.Production.json:ro

volumes:
  orbitaos-v6-logs:
