version: '3.8'

services:
  orbitaos-v6:
    image: orbitaos-v6:latest
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRINGS__DEFAULTCONNECTION:-Server=localhost;Database=OrbitAOS.V6;User=sa;Password=YourStrong!Passw0rd;MultipleActiveResultSets=true}
      - HOME__DOCUMENTATIONURL=${HOME__DOCUMENTATIONURL:-https://docs.microsoft.com/aspnet/core}
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
