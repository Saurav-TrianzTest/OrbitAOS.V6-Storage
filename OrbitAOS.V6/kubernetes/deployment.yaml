apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbita-os-v6
  namespace: orbita-os-v6
  labels:
    app: orbita-os-v6
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orbita-os-v6
  template:
    metadata:
      labels:
        app: orbita-os-v6
    spec:
      containers:
        - name: orbita-os-v6
          image: "{{IMAGE_URI}}"
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: DocsUrl
              value: "{{DOCS_URL}}"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: orbita-os-v6-secrets
                  key: connection-string
            - name: DB_HOST
              value: "{{DB_HOST}}"
            - name: DB_PORT
              value: "{{DB_PORT}}"
            - name: DB_NAME
              value: "{{DB_NAME}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
