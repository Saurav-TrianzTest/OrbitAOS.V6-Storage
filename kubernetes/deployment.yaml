apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitaaos-v6
  namespace: orbitaaos-v6
  labels:
    app: orbitaaos-v6
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orbitaaos-v6
  template:
    metadata:
      labels:
        app: orbitaaos-v6
    spec:
      containers:
        - name: orbitaaos-v6
          image: "{{IMAGE_URI}}"
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: TZ
              value: "UTC"
            - name: ConnectionStrings__DefaultConnection
              value: "{{DB_CONNECTION_STRING}}"
            - name: DocsUrl
              value: "{{DOCS_URL}}"
          envFrom:
            - secretRef:
                name: orbitaaos-v6-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      imagePullSecrets:
        - name: ecr-regcred
