apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitaos-v6
  namespace: orbitaos-v6
  labels:
    app: orbitaos-v6
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orbitaos-v6
  template:
    metadata:
      labels:
        app: orbitaos-v6
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: orbitaos-v6
          image: "{{IMAGE_URI}}"
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: orbitaos-v6-secrets
                  key: connection-string
            - name: AppUrls__Documentation
              value: "{{APPURLS__DOCUMENTATION}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
