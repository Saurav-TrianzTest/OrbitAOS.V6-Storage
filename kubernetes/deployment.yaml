apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitcontainer
  namespace: orbitcontainer
  labels:
    app: orbitcontainer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orbitcontainer
  template:
    metadata:
      labels:
        app: orbitcontainer
    spec:
      containers:
        - name: orbitcontainer
          image: "{{IMAGE_URI}}"
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: DocsUrl
              value: "{{DOCS_URL}}"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: orbitcontainer-secrets
                  key: ConnectionStrings__DefaultConnection
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
