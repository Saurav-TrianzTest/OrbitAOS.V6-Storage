apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitcontainerfix
  namespace: orbitcontainerfix
  labels:
    app: orbitcontainerfix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orbitcontainerfix
  template:
    metadata:
      labels:
        app: orbitcontainerfix
    spec:
      containers:
        - name: orbitcontainerfix
          image: "{{IMAGE_URI}}"
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: orbitcontainerfix-secrets
                  key: DB_CONNECTION_STRING
            - name: DocsUrl
              value: "{{DOCS_URL}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
